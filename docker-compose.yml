services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quote_app
      POSTGRES_USER: quote_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - quote-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_app -d quote_app"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: quote_app
      DB_USER: quote_app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://website-starter-beige.vercel.app}
    ports:
      - "3001:3001"

volumes:
  quote-postgres:
